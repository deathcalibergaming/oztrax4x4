name: G-NAF addresses

# Geoscape releases G-NAF quarterly - February, May, August, November -
# but the day it lands inside the release month moves around. Rather than
# guess it, this looks once a month, compares the release name against the
# one the current pack was built from, and stops there if they match. Eight
# runs a year cost a single small request to data.gov.au and nothing else.
#
# 20:10 UTC is about half past five in the morning in South Australia. The
# job that does run pulls about nine hundred megabytes of compressed tables
# for the nine state groups, inflates three and a half gigabytes of them
# through the disk, and writes a hundred and twenty thousand tiles. Allow
# the better part of two hours.

on:
  schedule:
    - cron: "10 20 5 * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if the release has not changed"
        type: boolean
        default: false

permissions:
  contents: write
  pages: read

concurrency:
  group: gnaf-addresses
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      # New South Wales is the shape of the headroom: 685 MB of
      # ADDRESS_DETAIL and 354 MB of geocodes, whose lookup maps are about a
      # gigabyte while that state is being read and are dropped before the
      # next one starts. The finished rows never accumulate in memory at
      # all - they go to a spool on disk and come back one tile column at a
      # time - so the peak is one state's joins, not the country's.
      - name: Build the address packs
        timeout-minutes: 150
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: node tools/build-gnaf.mjs ${{ inputs.force && '--force' || '' }}

      # A quarter's release rewrites most of the hundred and twenty thousand
      # tiles, so nothing is committed on the months where the release has
      # not moved and the script stopped early. On the months it has, this is
      # far and away the largest commit anything in this repository makes.
      - name: Commit if the release moved
        id: commit
        run: |
          # Staged first, because a fresh build writes the whole tree from
          # scratch and untracked files are invisible to a plain git diff.
          git add -A docs/addr
          if git diff --cached --quiet; then
            echo "address packs unchanged - nothing to commit"
            echo "pushed=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "G-NAF addresses, $(node -p "require('./docs/addr/index.json').release")"
          git push
          echo "pushed=yes" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The push is not the deploy. Pages builds main/docs separately and can
      # fail on its own, and when it does the site goes on serving the version
      # before this one without saying so. On a job that runs monthly that is a
      # month of stale roads behind a green tick.
      - name: Check the site actually took it
        if: steps.commit.outputs.pushed == 'yes'
        uses: ./.github/actions/pages-landed
        with:
          sha: ${{ steps.commit.outputs.sha }}
