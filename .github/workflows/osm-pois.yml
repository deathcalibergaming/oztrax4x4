name: POI pack

# Every POI in the country, carried on the phone. Same Geofabrik extracts the
# road packs are cut from, and the same reasoning about how often: Geofabrik
# rebuilds daily, and a new bakery in Adelaide is not worth a commit that
# rewrites ten thousand tiles. Once a month keeps it current to within a few
# weeks, which is far fresher than a bore or a rest area changes.
#
# The 19th, so it lands on neither the G-NAF job on the 5th nor the roads on
# the 12th. Nothing shares a working directory with them, but three jobs that
# each rewrite a tree of tiles are three jobs that should not race to push.

on:
  schedule:
    - cron: "40 20 19 * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if the extract has not changed"
        type: boolean
        default: false

permissions:
  contents: write
  pages: read

concurrency:
  group: osm-pois
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      # Seven extracts, largest 254 MB, taken one at a time: each is streamed
      # to the runner's disk, read twice, and deleted before the next starts,
      # so the peak is one extract in a Buffer plus the POIs gathered so far -
      # about what the single-state build peaked at, not seven times it. The
      # headroom is for New South Wales, which is four times South Australia.
      #
      # The download is the long pole rather than the parsing: 911 MB off
      # Geofabrik, sequentially, because seven at once is not a polite way to
      # treat somebody giving the data away. Allow the better part of an hour.
      - name: Build the POI pack
        timeout-minutes: 90
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: node tools/build-poi.mjs ${{ inputs.force && '--force' || '' }}

      - name: Commit if the extract moved
        id: commit
        run: |
          # Staged first, because a fresh build writes the whole tree from
          # scratch and untracked files are invisible to a plain git diff.
          git add -A docs/poi
          if git diff --cached --quiet; then
            echo "POI pack unchanged - nothing to commit"
            echo "pushed=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "POI pack, OpenStreetMap via Geofabrik $(node -p "require('./docs/poi/index.json').built")"
          git push
          echo "pushed=yes" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The push is not the deploy. Pages builds main/docs separately and can
      # fail on its own, and when it does the site goes on serving the version
      # before this one without saying so. On a job that runs monthly that is a
      # month of stale roads behind a green tick.
      - name: Check the site actually took it
        if: steps.commit.outputs.pushed == 'yes'
        uses: ./.github/actions/pages-landed
        with:
          sha: ${{ steps.commit.outputs.sha }}
